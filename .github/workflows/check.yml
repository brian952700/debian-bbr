name: Debian checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        debian: ['12', '13']
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax and safe smoke tests on Debian
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src debian:${{ matrix.debian }} \
            bash -c 'bash -n bbr.sh && bash -n tests/smoke.sh && bash tests/smoke.sh'
